name: Aethelgard AI-SRE Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    name: System Integrity & Unit Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System & Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Aethelgard Scaffolding & System Integrity Check
        run: |
          python verify_project.py

      - name: Execute Automated Test Suite
        run: |
          pytest tests/ -v

      - name: Test Docker Container Compilation
        run: |
          docker build -t aethelgard-target-test:latest ./target_service

      - name: Archive Incident Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethelgard-audit-reports
          path: reports/
          if-no-files-found: ignore

